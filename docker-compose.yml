# Runs PharmaSafe with a real PostgreSQL database.
#   docker compose up --build
# Then open http://localhost:8080
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pharmasafe
      POSTGRES_USER: pharmasafe
      POSTGRES_PASSWORD: pharmasafe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmasafe"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/pharmasafe
      DB_USER: pharmasafe
      DB_PASSWORD: pharmasafe
    ports:
      - "8080:8080"

volumes:
  pgdata:
