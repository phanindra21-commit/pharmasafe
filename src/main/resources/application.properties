spring.application.name=pharmasafe
server.port=8080

# Default: in-memory H2 database (no installation needed). Data resets on restart.
spring.datasource.url=jdbc:h2:mem:pharmasafe;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# H2 web console at http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:pharmasafe)
spring.h2.console.enabled=true

# Pretty-print JSON responses
spring.jackson.serialization.indent-output=true
