# Activate with:  --spring.profiles.active=postgres   (docker-compose does this for you)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pharmasafe}
spring.datasource.username=${DB_USER:pharmasafe}
spring.datasource.password=${DB_PASSWORD:pharmasafe}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
