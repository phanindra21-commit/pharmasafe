# PharmaSafe Spring Boot app behind a NodePort service.
# Starts with 1 replica so the sample data is seeded once; scale up after the first start:
#   kubectl scale deployment/pharmasafe --replicas=3
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharmasafe
  labels:
    app: pharmasafe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pharmasafe
  template:
    metadata:
      labels:
        app: pharmasafe
    spec:
      containers:
        - name: app
          image: pharmasafe:latest        # Jenkins replaces this with pharmasafe:<build number>
          imagePullPolicy: IfNotPresent   # image is built locally, not pulled from a registry
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: postgres
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/pharmasafe
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: pharmasafe-db, key: POSTGRES_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: pharmasafe-db, key: POSTGRES_PASSWORD }
          readinessProbe:
            httpGet:
              path: /api/dashboard/summary
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/dashboard/summary
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "768Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: pharmasafe
spec:
  type: NodePort
  selector:
    app: pharmasafe
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080     # open http://localhost:30080
